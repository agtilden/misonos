# Sonos discovery (SSDP multicast), speaker event callbacks, and speakers
# fetching audio from the bridge all require the containers to share the host's
# LAN interface -> network_mode: host. This works on a LINUX host only (it is a
# no-op on Docker Desktop for Mac/Windows).
services:
  bridge:
    build:
      context: .
      target: node-runtime
    image: misonos-node
    command: node apps/bridge/dist/index.js
    network_mode: host
    restart: unless-stopped
    environment:
      MISONOS_BRIDGE_PORT: "4317"
      # REQUIRED on a multi-homed host (e.g. with Tailscale): the LAN IP your
      # Sonos speakers can reach. Without this the bridge may auto-pick the
      # 100.x Tailscale address and speakers won't be able to fetch streams.
      MISONOS_BRIDGE_PUBLIC_HOST: "${MISONOS_LAN_IP}"
      MISONOS_GRATEFUL_URL: "http://127.0.0.1:4319"
      MISONOS_PHISH_URL: "http://127.0.0.1:4320"
      MISONOS_YTM_URL: "http://127.0.0.1:4321"
      MISONOS_PODCAST_URL: "http://127.0.0.1:4323"
      MISONOS_TUNEIN_URL: "http://127.0.0.1:4324"
      MISONOS_NAVIDROME_URL: "http://127.0.0.1:4325"
      # Writable SQLite store (preferences, recently-viewed, EQ presets). WAL
      # sidecars (misonos.db-wal/-shm) live alongside it in ./data.
      MISONOS_BRIDGE_DB: "/data/misonos.db"
    volumes:
      - ./data:/data

  grateful:
    image: misonos-node
    command: node apps/grateful-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_GRATEFUL_PORT: "4319"
      MISONOS_GRATEFUL_DB: "/data/gratefuldead.db"
    volumes:
      # Copy gratefuldead.db into ./data on the host before starting.
      - ./data/gratefuldead.db:/data/gratefuldead.db:ro

  phish:
    image: misonos-node
    command: node apps/phish-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_PHISH_PORT: "4320"
      MISONOS_PHISH_API_KEY: "${MISONOS_PHISH_API_KEY:-}"

  ytmusic:
    image: misonos-node
    command: node apps/ytmusic-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_YTM_PORT: "4321"
      # Pasted YT Music cookies (Library/My Supermix) persist here across restarts.
      YTMUSIC_COOKIES_PATH: "/data/ytmusic-cookies.json"
    volumes:
      - ./data:/data

  podcasts:
    image: misonos-node
    command: node apps/podcast-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_PODCAST_PORT: "4323"
      # Pinned shows live here (podcasts.db-wal/-shm sit alongside in ./data).
      MISONOS_PODCAST_DB: "/data/podcasts.db"
      # Optional: set both for Podcast Index search; otherwise falls back to the
      # key-free Apple Podcasts directory.
      PODCASTINDEX_KEY: "${PODCASTINDEX_KEY:-}"
      PODCASTINDEX_SECRET: "${PODCASTINDEX_SECRET:-}"
    volumes:
      - ./data:/data

  tunein:
    image: misonos-node
    command: node apps/tunein-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_TUNEIN_PORT: "4324"
      # Pinned stations live here (tunein.db-wal/-shm sit alongside in ./data).
      MISONOS_TUNEIN_DB: "/data/tunein.db"
    volumes:
      - ./data:/data

  navidrome:
    image: misonos-node
    command: node apps/navidrome-smapi/dist/index.js
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
    environment:
      MISONOS_NAVIDROME_PORT: "4325"
      # Optional: your Navidrome (or other Subsonic) server. The source stays
      # hidden until all three are set. Host networking: use an address the
      # host can reach, e.g. http://127.0.0.1:4533, not a service name.
      MISONOS_NAVIDROME_SERVER_URL: "${MISONOS_NAVIDROME_SERVER_URL:-}"
      MISONOS_NAVIDROME_USER: "${MISONOS_NAVIDROME_USER:-}"
      MISONOS_NAVIDROME_PASSWORD: "${MISONOS_NAVIDROME_PASSWORD:-}"
      # Speakers load cover art from this service directly, so advertise the LAN IP.
      MISONOS_NAVIDROME_PUBLIC_URL: "http://${MISONOS_LAN_IP}:4325"

  web:
    build:
      context: .
      target: web
    image: misonos-web
    network_mode: host
    restart: unless-stopped
    depends_on: [bridge]
